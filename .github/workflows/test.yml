name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    name: hook unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run rule-check unit tests
        run: python3 .claude/evals/rule-check/test_unit.py
      - name: Run lint-outbound unit tests
        run: python3 .claude/evals/lint-outbound/test_unit.py
      - name: Run pairing-guard unit tests
        run: python3 .claude/evals/pairing-guard/test_unit.py
      - name: Run model-policy unit tests
        run: python3 .claude/evals/model-policy/test_unit.py
      - name: Run confirm-risky unit tests
        run: python3 .claude/evals/confirm-risky/test_unit.py
      - name: Run pre-commit unit tests
        run: python3 .claude/evals/pre-commit/test_unit.py
      - name: Run session-start-state unit tests
        run: python3 .claude/evals/session-start-state/test_unit.py

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.17.5
      - name: Lint
        run: ruff check .claude
      - name: Check formatting
        run: ruff format --check .claude
